<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Chat - Gemini</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      max-width: 800px; 
      margin: 0 auto;
      background: #f5f5f5;
    }
    h1 { margin-bottom: 20px; color: #333; }
    #chat { 
      background: white; 
      border-radius: 10px; 
      padding: 20px; 
      margin-bottom: 20px;
      min-height: 400px;
      max-height: 600px;
      overflow-y: auto;
    }
    .message { 
      margin-bottom: 15px; 
      padding: 10px 15px;
      border-radius: 8px;
    }
    .user { 
      background: #007bff; 
      color: white; 
      margin-left: 50px;
      text-align: right;
    }
    .assistant { 
      background: #e9ecef; 
      color: #333;
      margin-right: 50px;
    }
    .role { 
      font-weight: bold; 
      margin-bottom: 5px;
      font-size: 12px;
      opacity: 0.8;
    }
    #input-form { 
      display: flex; 
      gap: 10px;
    }
    #input { 
      flex: 1; 
      padding: 12px; 
      border: 2px solid #ddd; 
      border-radius: 8px;
      font-size: 16px;
    }
    button { 
      padding: 12px 24px; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status { 
      padding: 10px; 
      margin-bottom: 10px; 
      border-radius: 5px;
      font-size: 14px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>🤖 CodeGPT - Test Page</h1>
  
  <div id="status" class="status success">✅ Ready to chat! Type your message below.</div>
  
  <div id="chat"></div>
  
  <form id="input-form">
    <input type="text" id="input" placeholder="Type your message... (e.g., 'Tell me a joke')" autofocus>
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const inputForm = document.getElementById('input-form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const status = document.getElementById('status');
    
    let messages = [];
    
    function addMessage(role, content) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.innerHTML = `
        <div class="role">${role === 'user' ? 'You' : 'AI Assistant'}</div>
        <div>${content}</div>
      `;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }
    
    function setStatus(message, isError = false) {
      status.textContent = message;
      status.className = `status ${isError ? 'error' : 'success'}`;
    }
    
    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const text = input.value.trim();
      if (!text) return;
      
      input.value = '';
      sendBtn.disabled = true;
      
      // Add user message
      messages.push({ role: 'user', content: text });
      addMessage('user', text);
      
      setStatus('🤔 AI is thinking...');
      
      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });
        
        if (!response.ok) {
          throw new Error('Request failed');
        }
        
        // Create assistant message container
        const assistantMsg = document.createElement('div');
        assistantMsg.className = 'message assistant';
        assistantMsg.innerHTML = `
          <div class="role">AI Assistant</div>
          <div id="assistant-text"></div>
        `;
        chat.appendChild(assistantMsg);
        
        const assistantText = document.getElementById('assistant-text');
        
        // Read streaming response
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value, { stream: true });
          fullText += chunk;
          assistantText.textContent = fullText;
          chat.scrollTop = chat.scrollHeight;
        }
        
        messages.push({ role: 'assistant', content: fullText });
        setStatus('✅ Ready to chat!');
        
      } catch (error) {
        console.error('Error:', error);
        addMessage('assistant', '❌ Sorry, something went wrong. Please try again.');
        setStatus('❌ Error occurred. Try again.', true);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
    
    // Add welcome message
    addMessage('assistant', 'Hello! I\'m your AI assistant powered by Google Gemini. Ask me anything!');
  </script>
</body>
</html>
