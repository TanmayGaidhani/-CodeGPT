<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - CodeGPT</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <!-- Background Effects -->
    <div class="auth-bg">
      <div class="gradient-orb orb-1"></div>
      <div class="gradient-orb orb-2"></div>
      <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
      <span>←</span> Back to Home
    </a>

    <!-- Login Card -->
    <div class="auth-card" id="login-card">
      <div class="auth-header">
        <div class="auth-logo">🤖</div>
        <h1>Welcome back</h1>
        <p>Sign in to continue your AI journey</p>
      </div>
      
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" minlength="6" required />
        </div>
        <button class="btn-submit" type="submit">
          <span>Sign In</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>
      
      <div class="auth-divider">
        <span>or</span>
      </div>
      
      <div class="auth-switch">
        Don't have an account? <a href="#" id="show-register">Create one</a>
      </div>
    </div>

    <!-- Register Card -->
    <div class="auth-card" id="register-card" style="display:none">
      <div class="auth-header">
        <div class="auth-logo">🤖</div>
        <h1>Create account</h1>
        <p>Start your AI-powered conversations today</p>
      </div>
      
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="r-name" placeholder="John Doe" minlength="2" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="r-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="r-password" placeholder="At least 6 characters" minlength="6" required />
        </div>
        <button class="btn-submit" type="submit">
          <span>Create Account</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>
      
      <div class="auth-divider">
        <span>or</span>
      </div>
      
      <div class="auth-switch">
        Already have an account? <a href="#" id="show-login">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script>
    const loginCard = document.getElementById('login-card');
    const registerCard = document.getElementById('register-card');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    
    // Toggle between login and register
    document.getElementById('show-register').onclick = (e) => {
      e.preventDefault();
      loginCard.style.display = 'none';
      registerCard.style.display = 'block';
    };
    
    document.getElementById('show-login').onclick = (e) => {
      e.preventDefault();
      registerCard.style.display = 'none';
      loginCard.style.display = 'block';
    };

    function setToken(t){ localStorage.setItem('token', t); }
    function getBody(res){ return res.headers.get('content-type')?.includes('application/json')? res.json(): res.text().then(t=>({error:t})) }

    loginForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const btn = e.target.querySelector('.btn-submit');
      btn.classList.add('loading');
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        btn.classList.remove('loading');
        return alert('Enter a valid email');
      }
      if(!password || password.length < 6) {
        btn.classList.remove('loading');
        return alert('Password must be at least 6 characters');
      }
      
      try {
        const res = await fetch('/api/auth/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
        const data = await getBody(res);
        if(!res.ok){ 
          btn.classList.remove('loading');
          return alert(data.error || 'Login failed'); 
        }
        setToken(data.token);
        location.href = '/chat';
      } catch(err) {
        btn.classList.remove('loading');
        alert('Connection error. Please try again.');
      }
    });

    registerForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const btn = e.target.querySelector('.btn-submit');
      btn.classList.add('loading');
      
      const name = document.getElementById('r-name').value.trim();
      const email = document.getElementById('r-email').value.trim();
      const password = document.getElementById('r-password').value;
      
      // Validate name
      if(!name || name.length < 2) {
        btn.classList.remove('loading');
        return alert('Name must be at least 2 characters');
      }
      
      // Validate email
      if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        btn.classList.remove('loading');
        return alert('Enter a valid email');
      }
      
      // Validate password
      if(!password || password.length < 6) {
        btn.classList.remove('loading');
        return alert('Password must be at least 6 characters');
      }
      
      try {
        const res = await fetch('/api/auth/register',{ 
          method:'POST', 
          headers:{'Content-Type':'application/json'}, 
          body: JSON.stringify({ name, email, password }) 
        });
        const data = await getBody(res);
        if(!res.ok){ 
          btn.classList.remove('loading');
          return alert(data.error || 'Registration failed'); 
        }
        setToken(data.token);
        // Store user info
        localStorage.setItem('user', JSON.stringify(data.user));
        location.href = '/chat';
      } catch(err) {
        btn.classList.remove('loading');
        alert('Connection error. Please try again.');
      }
    });
  </script>
</body>
</html>
